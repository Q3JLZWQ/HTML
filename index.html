        function escapeText(text) {

        function createTagElement(tagName) {
            const tagEl = document.createElement('span');
            tagEl.className = 'apple-tag';

            iconSpan.innerHTML = createSVGIcon(tagName.toLowerCase());
            const textSpan = document.createElement('span');
            textSpan.textContent = tagName;
            tagEl.appendChild(iconSpan);
            tagEl.appendChild(textSpan);
            return tagEl;
        }

        const intersectionObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('revealed');
                    intersectionObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

        const sectionObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('section-visible');
                    sectionObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15, rootMargin: '0px 0px -10% 0px' });

        function filterProjects(filter) {
            if (isFilterAnimating || activeFilter === filter) return;

            isFilterAnimating = true;
            activeFilter = filter;

            // UI/UX: Add loading state to filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.add('opacity-50', 'pointer-events-none');
            });

            const cards = document.querySelectorAll('.project-card');
            const visibleCards = [];
            const hiddenCards = [];

            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === filter) {
                    btn.classList.add('active-filter');
                    btn.setAttribute('aria-pressed', 'true');
                    // UI/UX: Add aria-current to active filter
                    btn.setAttribute('aria-current', 'true');
                } else {
                    btn.classList.remove('active-filter');
                    btn.setAttribute('aria-pressed', 'false');
                    btn.removeAttribute('aria-current');
                }
            });

            cards.forEach(card => {
                const index = parseInt(card.dataset.index);
                const project = projects[index];
                if (filter === 'all' || project.tags.includes(filter)) {
                    visibleCards.push(card);
                } else {
                    hiddenCards.push(card);
                }
            });

            cards.forEach(card => {
                card.classList.add('is-filtering');
                card.style.opacity = '0';
                card.style.transform = 'translateY(8px) scale(0.98)';
            });

            setTimeout(() => {
                hiddenCards.forEach(card => {
                    card.style.display = 'none';
                });

                visibleCards.forEach((card, i) => {
                    card.style.display = '';
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(16px) scale(0.98)';

                    setTimeout(() => {
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0) scale(1)';
                    }, i * 50);
                });

                const totalAnimationTime = 300 + (visibleCards.length * 50) + 200;
                setTimeout(() => {
                    cards.forEach(card => {
                        card.classList.remove('is-filtering');
                        card.style.opacity = '';
                        card.style.transform = '';
                    });

                    // UI/UX: Remove loading state from filter buttons
                    document.querySelectorAll('.filter-btn').forEach(btn => {
                        btn.classList.remove('opacity-50', 'pointer-events-none');
                    });

                    // UI/UX: Announce filter results via ARIA live region
                    const count = visibleCards.length;
                    els.filterResults.textContent = `${count} project${count !== 1 ? 's' : ''} shown`;

                    isFilterAnimating = false;
                }, totalAnimationTime);

            }, 300);
        }

        function updateSlideVisuals(index) {
            document.querySelectorAll('.slide-item').forEach(s => s.classList.add('opacity-0'));
            document.querySelectorAll('.slide-dot').forEach(d => {
                d.classList.remove('w-6', 'bg-white', 'shadow-lg');
            });
            const slide = document.querySelector('.slide-item[data-slide="' + index + '"]');
            const dot = document.querySelector('.slide-dot[data-slide="' + index + '"]');
            if (slide) slide.classList.remove('opacity-0');
            if (dot) {
                dot.classList.add('w-6', 'bg-white', 'shadow-lg');
                dot.setAttribute('aria-pressed', 'true');
            }
            document.querySelectorAll('.slide-dot').forEach((d, i) => {
                if (i !== index) d.setAttribute('aria-pressed', 'false');
            });

            const prevBtn = document.getElementById('sliderArrowPrev');
            const nextBtn = document.getElementById('sliderArrowNext');
            if (prevBtn && currentProject) {
                prevBtn.disabled = index === 0;
            }
            if (nextBtn && currentProject) {
                nextBtn.disabled = index === currentProject.slides.length - 1;
            }
        }

        function navigateSlide(direction) {
            if (!currentProject) return;
            const newIndex = direction === 'prev'
                ? Math.max(0, currentSlideIndex - 1)
                : Math.min(currentProject.slides.length - 1, currentSlideIndex + 1);

            if (newIndex !== currentSlideIndex) {
                currentSlideIndex = newIndex;
                updateSlideVisuals(newIndex);
                slideshowPaused = false;
                restartSlideshow();
            }
        }

        function openProject(index) {
            currentProject = projects[index];
            currentSlideIndex = 0;
            slideshowPaused = false;
            lastFocusedElement = document.activeElement;

            const wrapper = document.createElement('div');
            wrapper.className = 'mb-6';

            currentProject.tags.forEach(tag => tagsContainer.appendChild(createTagElement(tag)));

            const metaGrid = document.createElement('div');
            metaGrid.className = 'grid grid-cols-2 gap-4 mb-8 p-6 apple-glass rounded-2xl';

            const metaItems = [

            });

            const slideshowWrapper = document.createElement('div');
            slideshowWrapper.className = 'slider-wrapper relative w-full aspect-[16/9] rounded-2xl overflow-hidden border border-white/10 bg-black mb-6 group';

            // UI/UX: Improved aria-label for slideshow navigation with slide titles
            const prevBtn = document.createElement('button');
            prevBtn.type = 'button';
            prevBtn.id = 'sliderArrowPrev';
            prevBtn.className = 'slider-arrow slider-arrow--prev';
            prevBtn.setAttribute('aria-label', 'Previous slide: ' + (currentProject.slides[currentSlideIndex - 1] || currentProject.slides[currentProject.slides.length - 1]));
            prevBtn.innerHTML = '<svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>';
            prevBtn.addEventListener('click', () => navigateSlide('prev'));
            prevBtn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigateSlide('prev'); }
            });
            slideshowWrapper.appendChild(prevBtn);

            const nextBtn = document.createElement('button');
            nextBtn.type = 'button';
            nextBtn.id = 'sliderArrowNext';
            nextBtn.className = 'slider-arrow slider-arrow--next';
            nextBtn.setAttribute('aria-label', 'Next slide: ' + (currentProject.slides[currentSlideIndex + 1] || currentProject.slides[0]));
            nextBtn.innerHTML = '<svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>';
            nextBtn.addEventListener('click', () => navigateSlide('next'));
            nextBtn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigateSlide('next'); }
            });
            slideshowWrapper.appendChild(nextBtn);

            currentProject.slides.forEach((slide, i) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'absolute inset-0 opacity-0 transition-opacity duration-500 slide-item';
                slideDiv.dataset.slide = String(i);

                // Performance: Add sizes attribute for responsive image loading in slides
                img.sizes = '(max-width: 768px) 100vw, (max-width: 1200px) 80vw, 60vw';
                img.loading = i === 0 ? 'eager' : 'lazy';
                img.decoding = 'async';

                img.addEventListener('error', () => {
                    img.style.display = 'none';
                    const fallback = document.createElement('div');
                    fallback.className = 'absolute inset-0 bg-gray-900 flex items-center justify-center';
                    fallback.innerHTML = '<span class="text-white/30 text-sm">Image unavailable</span>';
                    slideDiv.appendChild(fallback);
                });

                slideDiv.appendChild(img);
                slideshowWrapper.appendChild(slideDiv);
            });

            const dotsContainer = document.createElement('div');
            dotsContainer.className = 'flex justify-center gap-2 mt-6';

            currentProject.slides.forEach((slide, i) => {
                const dot = document.createElement('button');
                dot.type = 'button';
                dot.className = 'w-2 h-2 rounded-full bg-white/30 border border-white/10 hover:bg-white/50 transition-all cursor-pointer slide-dot';
                // UI/UX: Improve touch target for dots
                dot.style.minWidth = '16px';
                dot.style.minHeight = '16px';
                dot.dataset.slide = String(i);
                dot.setAttribute('aria-label', 'Go to slide ' + (i + 1) + ': ' + escapeText(slide || ('Slide ' + (i + 1))));
                dot.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');

                dot.addEventListener('click', () => {
                    currentSlideIndex = i;
                    updateSlideVisuals(i);
                    slideshowPaused = false;
                    restartSlideshow();
                });

                dot.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        currentSlideIndex = i;
                        updateSlideVisuals(i);
                        slideshowPaused = false;
                        restartSlideshow();
                    }
                });

                dotsContainer.appendChild(dot);
            });

            els.modalContent.innerHTML = '';
            els.modalContent.append(wrapper, tagsContainer, metaGrid, slideshowWrapper, dotsContainer);

            els.modal.setAttribute('aria-labelledby', 'modalTitle');

            els.modal.classList.remove('invisible', 'opacity-0');
            els.modalContent.classList.remove('opacity-0');
            els.modal.setAttribute('aria-hidden', 'false');

            // UI/UX: Use overscroll-behavior instead of overflow: hidden for modal
            document.documentElement.style.overflow = 'hidden';
            document.body.style.overscrollBehavior = 'contain';

            requestAnimationFrame(() => {
                els.modalClose.focus();
            });

            function trapFocus(element) {
                const focusable = element.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
                const first = focusable[0];
                const last = focusable[focusable.length - 1];

                element.addEventListener('keydown', (e) => {
                    if (e.key === 'Tab') {
                        if (e.shiftKey && document.activeElement === first) {
                            e.preventDefault();
                            last.focus();
                        } else if (!e.shiftKey && document.activeElement === last) {
                            e.preventDefault();
                            first.focus();
                        }
                    }
                });
            }
            trapFocus(els.modalContent);

            slideshowWrapper.addEventListener('mouseenter', () => { slideshowPaused = true; });
            slideshowWrapper.addEventListener('mouseleave', () => { slideshowPaused = false; });

            const firstSlide = document.querySelector('.slide-item[data-slide="0"]');
            if (firstSlide) firstSlide.classList.remove('opacity-0');

            prevBtn.disabled = true;

            startSlideshow();
        }

        function closeProject() {
            els.modal.classList.add('opacity-0');
            els.modalContent.classList.add('opacity-0');
            setTimeout(() => {
                els.modal.classList.add('invisible');
                els.modal.setAttribute('aria-hidden', 'true');

                // UI/UX: Restore scroll behavior on close
                document.documentElement.style.overflow = '';
                document.body.style.overscrollBehavior = '';

                stopSlideshow();
                if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') lastFocusedElement.focus();
            }, 200);
        }

        function startSlideshow() {
            if (prefersReducedMotion) return;
            stopSlideshow();
            slideInterval = setInterval(() => {
                if (!slideshowPaused) {
                    const nextIndex = (currentSlideIndex + 1) % currentProject.slides.length;
                    updateSlideVisuals(nextIndex);
                    currentSlideIndex = nextIndex;
                }
            }, 4000);
        }

        function restartSlideshow() { startSlideshow(); }

        function stopSlideshow() {
            if (slideInterval) {
                clearInterval(slideInterval);
                slideInterval = null;
            }
        }

        if (els.menuBtn && els.menuDropdown) {
            els.menuBtn.addEventListener('click', () => {
                isMenuOpen = !isMenuOpen;
                
                if (isMenuOpen) {
                    els.menuBtn.classList.add('active');
                    els.menuDropdown.classList.remove('opacity-0', 'invisible', 'translate-y-2', 'scale-95');
                    els.menuDropdown.setAttribute('aria-hidden', 'false');
                    els.menuBtn.setAttribute('aria-expanded', 'true');
                    setTimeout(() => {
                        const firstLink = els.menuDropdown.querySelector('a');
                        if (firstLink) firstLink.focus();
                    }, 100);
                } else {
                    els.menuBtn.classList.remove('active');
                    closeMenu();
                }
            });

            document.addEventListener('click', (e) => {
                if (isMenuOpen && !els.menuBtn.contains(e.target) && !els.menuDropdown.contains(e.target)) {
                    if (isMenuOpen) {
                        els.menuBtn.classList.remove('active');
                        closeMenu();
                    }
                }
            });

            els.menuDropdown.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { 
                    els.menuBtn.classList.remove('active');
                    closeMenu(); 
                    els.menuBtn.focus(); 
                    return; 
                }

                const items = Array.from(els.menuDropdown.querySelectorAll('[role="menuitem"]'));
                const currentIndex = items.indexOf(document.activeElement);

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (items[(currentIndex + 1) % items.length]) items[(currentIndex + 1) % items.length].focus();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (items[(currentIndex - 1 + items.length) % items.length]) items[(currentIndex - 1 + items.length) % items.length].focus();
                }
            });

            els.menuDropdown.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', (e) => {
                    const targetId = link.getAttribute('href');
                    if (targetId && targetId.startsWith('#')) {
                        e.preventDefault();
                        if (isMenuOpen) {
                            els.menuBtn.classList.remove('active');
                            closeMenu();
                        }
                        const targetEl = document.getElementById(targetId.slice(1));
                        if (targetEl) {
                            setTimeout(() => {
                                targetEl.scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth' });
                            }, 150);
                        }
                    }
                });
            });
        }

        function closeMenu() {
            isMenuOpen = false;
            els.menuDropdown.classList.add('opacity-0', 'invisible', 'translate-y-2', 'scale-95');
            els.menuDropdown.setAttribute('aria-hidden', 'true');
            els.menuBtn.setAttribute('aria-expanded', 'false');
        }

        if (els.scrollBtn) {
            els.scrollBtn.addEventListener('click', () => {
                const portfolio = document.getElementById('portfolio');
                if (portfolio) {
                    portfolio.scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth' });
                }
            });
        }

        if (els.backToTop) {
            const portfolioSection = document.getElementById('portfolio');

            window.addEventListener('scroll', () => {
                if (portfolioSection) {
                    const portfolioTop = portfolioSection.offsetTop;
                    if (window.scrollY > portfolioTop - 200) {
                        els.backToTop.classList.add('visible');
                    } else {
                        els.backToTop.classList.remove('visible');
                    }
                }
            }, { passive: true });

            els.backToTop.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: prefersReducedMotion ? 'auto' : 'smooth' });
            });
        }

        if (els.modalClose && els.modalBackdrop) {
            els.modalClose.addEventListener('click', closeProject);
            els.modalBackdrop.addEventListener('click', closeProject);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !els.modal.classList.contains('invisible')) closeProject();
        });

        const contentReady = new Promise(resolve => {
            if (document.readyState === 'complete') resolve();
            else window.addEventListener('load', resolve);
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderFilters();
            renderProjects();

            document.querySelectorAll('.reveal-item').forEach(item => {
                intersectionObserver.observe(item);
            });

            if (els.portfolioSection) {
                sectionObserver.observe(els.portfolioSection);
            }

            const minDisplay = 300;
            const readyTime = Date.now();

            contentReady.then(() => {
                const remaining = Math.max(0, minDisplay - (Date.now() - readyTime));
                setTimeout(() => {
                    els.loading.classList.add('opacity-0');
                    setTimeout(() => els.loading.classList.add('hidden'), 500);
                }, remaining);
            });
        });

        const heroVideo = document.querySelector('.hero-video-container video');
        if (heroVideo) heroVideo.addEventListener('error', () => {
            const fallback = document.querySelector('.hero-fallback');
            if (fallback) fallback.style.display = 'block';
        });

        window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', (e) => {
            if (e.matches) stopSlideshow();
            else if (currentProject) startSlideshow();
        });
    </script>
</body>
</html>
