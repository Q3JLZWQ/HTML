                    const path4 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path4.setAttribute('d', 'M5 5.5A3.5 3.5 0 0 1 8.5 2H12v7H8.5A3.5 3.5 0 0 1 5 5.5zM12 2h3.5a3.5 3.5 0 1 1 0 7H12V2zm0 9.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0zM5 19.5A3.5 3.5 0 0 1 8.5 16H12v3.5a3.5 3.5 0 1 1-7 0zM5 12a3.5 3.5 0 0 1 3.5-3.5H12v7H8.5A3.5 3.5 0 0 1 5 12z');
                    svg.appendChild(path4);
                    return svg.outerHTML;
                case 'illustrator':
                    const path5 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path5.setAttribute('d', 'M12 19l7-7 3 3-7 7-3-3z');
                    const path6 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path6.setAttribute('d', 'M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z');

                    const path8 = document.createElementNS('http://www.w3.org/2000/svg', 'path');

        function escapeText(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.textContent;
        }

        function createTagElement(tagName) {
            const tagEl = document.createElement('span');
            tagEl.className = 'apple-tag';
            const iconSpan = document.createElement('span');
            iconSpan.innerHTML = createSVGIcon(tagName.toLowerCase());
            const textSpan = document.createElement('span');
            textSpan.textContent = tagName;
            tagEl.appendChild(iconSpan);
            tagEl.appendChild(textSpan);
            return tagEl;
        }

        const intersectionObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('revealed');
                    intersectionObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

        const sectionObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('section-visible');
                    sectionObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15, rootMargin: '0px 0px -10% 0px' });

        function renderFilters() {
            const allTags = [...new Set(projects.flatMap(p => p.tags))];

            const allBtn = document.createElement('button');
            allBtn.className = 'apple-tag filter-btn active-filter';
            allBtn.setAttribute('data-filter', 'all');
            allBtn.setAttribute('aria-pressed', 'true');
            allBtn.textContent = 'All';
            allBtn.addEventListener('click', () => filterProjects('all'));
            allBtn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    filterProjects('all');
                }
            });
            els.filterContainer.appendChild(allBtn);

            allTags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'apple-tag filter-btn';
                btn.setAttribute('data-filter', tag);
                btn.setAttribute('aria-pressed', 'false');
                btn.textContent = tag;
                btn.addEventListener('click', () => filterProjects(tag));
                btn.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        filterProjects(tag);
                    }
                });
                els.filterContainer.appendChild(btn);
            });

            els.filterContainer.classList.add('reveal-item');
            intersectionObserver.observe(els.filterContainer);
        }

        function filterProjects(filter) {
            if (isFilterAnimating || activeFilter === filter) return;

            isFilterAnimating = true;
            activeFilter = filter;

            const cards = document.querySelectorAll('.project-card');
            const visibleCards = [];
            const hiddenCards = [];

            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === filter) {
                    btn.classList.add('active-filter');
                    btn.setAttribute('aria-pressed', 'true');
                } else {
                    btn.classList.remove('active-filter');
                    btn.setAttribute('aria-pressed', 'false');
                }
            });

            cards.forEach(card => {
                const index = parseInt(card.dataset.index);
                const project = projects[index];
                if (filter === 'all' || project.tags.includes(filter)) {
                    visibleCards.push(card);
                } else {
                    hiddenCards.push(card);
                }
            });

            cards.forEach(card => {
                card.classList.add('is-filtering');
                card.style.opacity = '0';
                card.style.transform = 'translateY(8px) scale(0.98)';
            });

            setTimeout(() => {
                hiddenCards.forEach(card => {
                    card.style.display = 'none';
                });

                visibleCards.forEach((card, i) => {
                    card.style.display = '';
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(16px) scale(0.98)';

                    setTimeout(() => {
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0) scale(1)';
                    }, i * 50);
                });

                const totalAnimationTime = 300 + (visibleCards.length * 50) + 200;
                setTimeout(() => {
                    cards.forEach(card => {
                        card.classList.remove('is-filtering');
                        card.style.opacity = '';
                        card.style.transform = '';
                    });
                    isFilterAnimating = false;
                }, totalAnimationTime);

            }, 300);
        }

        function renderProjects() {
            els.grid.innerHTML = '';
            projects.forEach((project, index) => {
                const article = document.createElement('article');
                article.className = 'project-card group cursor-pointer reveal-item';
                article.dataset.index = String(index);
                article.tabIndex = 0;
                article.role = 'listitem';
                article.setAttribute('aria-label', 'View ' + escapeText(project.name) + ' project details');

                const bgMedia = document.createElement('div');
                bgMedia.className = 'absolute inset-0 z-0';

                if (project.image) {
                    const skeleton = document.createElement('div');
                    skeleton.className = 'absolute inset-0 skeleton img-loading';
                    bgMedia.appendChild(skeleton);

                    const img = document.createElement('img');
                    img.src = project.image;
                    img.alt = escapeText(project.name) + ' thumbnail';
                    img.className = 'project-card-image w-full h-full object-cover img-loading';
                    img.loading = 'lazy';
                    img.decoding = 'async';

                    img.addEventListener('load', () => {
                        img.classList.remove('img-loading');
                        img.classList.add('img-loaded');
                        skeleton.style.display = 'none';
                    });
                    img.addEventListener('error', () => {
                        img.style.display = 'none';
                        skeleton.style.display = 'none';
                        const placeholder = document.createElement('div');
                        placeholder.className = 'absolute inset-0 bg-gray-800 flex items-center justify-center';
                        placeholder.setAttribute('role', 'img');
                        placeholder.setAttribute('aria-label', escapeText(project.name) + ' - Image unavailable');
                        const textEl = document.createElement('span');
                        textEl.className = 'text-white/30 text-sm';
                        textEl.textContent = 'Image unavailable';
                        placeholder.appendChild(textEl);
                        bgMedia.appendChild(placeholder);
                    });
                    bgMedia.appendChild(img);
                }

                const gradientOverlay = document.createElement('div');
                gradientOverlay.className = 'absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent';
                bgMedia.appendChild(gradientOverlay);

                article.appendChild(bgMedia);

                const content = document.createElement('div');
                content.className = 'relative z-10 h-full flex flex-col justify-between p-6 md:p-8 project-card-content';

                const yearBadge = createTagElement(project.year);
                const titleWrapper = document.createElement('div');
                titleWrapper.className = 'flex justify-between items-start mb-3 md:mb-4';
                titleWrapper.appendChild(yearBadge);

                const title = document.createElement('h3');
                title.className = 'text-2xl md:text-3xl lg:text-4xl font-semibold text-white leading-tight mb-2 md:mb-3 tracking-tight';
                title.textContent = project.name;

                const description = document.createElement('p');
                description.className = 'text-xs md:text-sm text-white/60 line-clamp-2 max-w-md mb-4 md:mb-6 leading-relaxed';
                description.textContent = project.desc || '';

                const tagsContainer = document.createElement('div');
                tagsContainer.className = 'flex flex-wrap gap-2';
                project.tags.forEach(tag => tagsContainer.appendChild(createTagElement(tag)));

                content.append(titleWrapper, title, description, tagsContainer);
                article.appendChild(content);
                els.grid.appendChild(article);

                intersectionObserver.observe(article);

                article.addEventListener('click', () => openProject(parseInt(article.dataset.index)));

                article.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openProject(parseInt(article.dataset.index));
                    }
                });
            });
        }

        function updateSlideVisuals(index) {
            document.querySelectorAll('.slide-item').forEach(s => s.classList.add('opacity-0'));
            document.querySelectorAll('.slide-dot').forEach(d => {
                d.classList.remove('w-6', 'bg-white', 'shadow-lg');
            });
            const slide = document.querySelector('.slide-item[data-slide="' + index + '"]');
            const dot = document.querySelector('.slide-dot[data-slide="' + index + '"]');
            if (slide) slide.classList.remove('opacity-0');
            if (dot) {
                dot.classList.add('w-6', 'bg-white', 'shadow-lg');
                dot.setAttribute('aria-pressed', 'true');
            }
            document.querySelectorAll('.slide-dot').forEach((d, i) => {
                if (i !== index) d.setAttribute('aria-pressed', 'false');
            });
        }

        function openProject(index) {
            currentProject = projects[index];
            currentSlideIndex = 0;
            slideshowPaused = false;
            lastFocusedElement = document.activeElement;

            const wrapper = document.createElement('div');
            wrapper.className = 'mb-6';

            const titleEl = document.createElement('h2');
            titleEl.id = 'modalTitle';
            titleEl.className = 'text-3xl md:text-4xl font-light text-white mb-2 tracking-tight';
            titleEl.textContent = currentProject.name;

            const descEl = document.createElement('p');
            descEl.className = 'text-white/50 text-base';
            descEl.textContent = currentProject.desc || '';

            wrapper.append(titleEl, descEl);

            const tagsContainer = document.createElement('div');
            tagsContainer.className = 'flex flex-wrap gap-2 mb-8';
            currentProject.tags.forEach(tag => tagsContainer.appendChild(createTagElement(tag)));

            const metaGrid = document.createElement('div');
            metaGrid.className = 'grid grid-cols-2 gap-4 mb-8 p-6 apple-glass rounded-2xl';

            const metaItems = [
                { label: 'Year', value: currentProject.year },
                { label: 'Category', value: currentProject.category || '-' },
                { label: 'Duration', value: currentProject.duration || '-' },
                { label: 'Status', value: currentProject.status || '-' }
            ];

            metaItems.forEach(item => {
                const metaEl = document.createElement('div');
                metaEl.innerHTML = '<p class="text-white/40 text-xs uppercase tracking-wider mb-1">' + item.label + '</p><p class="text-white/90 font-medium">' + escapeText(item.value) + '</p>';
                metaGrid.appendChild(metaEl);
            });

            const slideshowWrapper = document.createElement('div');
            slideshowWrapper.className = 'relative w-full aspect-[16/9] rounded-2xl overflow-hidden border border-white/10 bg-black mb-6';

            currentProject.slides.forEach((slide, i) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'absolute inset-0 opacity-0 transition-opacity duration-500 slide-item';
                slideDiv.dataset.slide = String(i);

                const img = document.createElement('img');
                img.src = currentProject.slideImages[i];
                img.alt = escapeText(slide) || ('Slide ' + (i + 1));
                img.className = 'w-full h-full object-cover';
                img.loading = i === 0 ? 'eager' : 'lazy';
                img.decoding = 'async';

                img.addEventListener('error', () => {
                    img.style.display = 'none';
                    const fallback = document.createElement('div');
                    fallback.className = 'absolute inset-0 bg-gray-900 flex items-center justify-center';
                    fallback.innerHTML = '<span class="text-white/30 text-sm">Image unavailable</span>';
                    slideDiv.appendChild(fallback);
                });

                slideDiv.appendChild(img);
                slideshowWrapper.appendChild(slideDiv);
            });

            const dotsContainer = document.createElement('div');
            dotsContainer.className = 'flex justify-center gap-2 mt-6';

            currentProject.slides.forEach((slide, i) => {
                const dot = document.createElement('button');
                dot.type = 'button';
                dot.className = 'w-2 h-2 rounded-full bg-white/30 border border-white/10 hover:bg-white/50 transition-all cursor-pointer slide-dot' + (i === 0 ? ' w-6 bg-white shadow-lg' : '');
                dot.dataset.slide = String(i);
                dot.setAttribute('aria-label', 'Go to slide ' + (i + 1) + ': ' + escapeText(slide || ('Slide ' + (i + 1))));
                dot.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');

                dot.addEventListener('click', () => {
                    currentSlideIndex = i;
                    updateSlideVisuals(i);
                    slideshowPaused = false;
                    restartSlideshow();
                });

                dot.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        currentSlideIndex = i;
                        updateSlideVisuals(i);
                        slideshowPaused = false;
                        restartSlideshow();
                    }
                });

                dotsContainer.appendChild(dot);
            });

            els.modalContent.innerHTML = '';
            els.modalContent.append(wrapper, tagsContainer, metaGrid, slideshowWrapper, dotsContainer);

            els.modal.setAttribute('aria-labelledby', 'modalTitle');

            els.modal.classList.remove('invisible', 'opacity-0');
            els.modalContent.classList.remove('opacity-0');
            els.modal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';

            requestAnimationFrame(() => {
                els.modalClose.focus();
            });

            function trapFocus(element) {
                const focusable = element.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
                const first = focusable[0];
                const last = focusable[focusable.length - 1];

                element.addEventListener('keydown', (e) => {
                    if (e.key === 'Tab') {
                        if (e.shiftKey && document.activeElement === first) {
                            e.preventDefault();
                            last.focus();
                        } else if (!e.shiftKey && document.activeElement === last) {
                            e.preventDefault();
                            first.focus();
                        }
                    }
                });
            }
            trapFocus(els.modalContent);

            slideshowWrapper.addEventListener('mouseenter', () => { slideshowPaused = true; });
            slideshowWrapper.addEventListener('mouseleave', () => { slideshowPaused = false; });

            const firstSlide = document.querySelector('.slide-item[data-slide="0"]');
            if (firstSlide) firstSlide.classList.remove('opacity-0');

            startSlideshow();
        }

        function closeProject() {
            els.modal.classList.add('opacity-0');
            els.modalContent.classList.add('opacity-0');
            setTimeout(() => {
                els.modal.classList.add('invisible');
                els.modal.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
                stopSlideshow();
                if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') lastFocusedElement.focus();
            }, 200);
        }

        function startSlideshow() {
            if (prefersReducedMotion) return;
            stopSlideshow();
            slideInterval = setInterval(() => {
                if (!slideshowPaused) {
                    const nextIndex = (currentSlideIndex + 1) % currentProject.slides.length;
                    updateSlideVisuals(nextIndex);
                    currentSlideIndex = nextIndex;
                }
            }, 4000);
        }

        function restartSlideshow() { startSlideshow(); }

        function stopSlideshow() {
            if (slideInterval) {
                clearInterval(slideInterval);
                slideInterval = null;
            }
        }

        // FIX: Added explicit click handler for menu links to ensure reliable navigation & menu closing
        if (els.menuBtn && els.menuDropdown) {
            els.menuBtn.addEventListener('click', () => {
                isMenuOpen = !isMenuOpen;
                if (isMenuOpen) {
                    els.menuDropdown.classList.remove('opacity-0', 'invisible', 'translate-y-2', 'scale-95');
                    els.menuDropdown.setAttribute('aria-hidden', 'false');
                    els.menuBtn.setAttribute('aria-expanded', 'true');
                    setTimeout(() => {
                        const firstLink = els.menuDropdown.querySelector('a');
                        if (firstLink) firstLink.focus();
                    }, 100);
                } else closeMenu();
            });
            document.addEventListener('click', (e) => {
                if (isMenuOpen && !els.menuBtn.contains(e.target) && !els.menuDropdown.contains(e.target)) closeMenu();
            });
            els.menuDropdown.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { closeMenu(); els.menuBtn.focus(); return; }

                const items = Array.from(els.menuDropdown.querySelectorAll('[role="menuitem"]'));
                const currentIndex = items.indexOf(document.activeElement);

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (items[(currentIndex + 1) % items.length]) items[(currentIndex + 1) % items.length].focus();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (items[(currentIndex - 1 + items.length) % items.length]) items[(currentIndex - 1 + items.length) % items.length].focus();
                }
            });

            // Handle clicks on dropdown links
            els.menuDropdown.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', (e) => {
                    const targetId = link.getAttribute('href');
                    if (targetId && targetId.startsWith('#')) {
                        e.preventDefault(); // Prevent default hash jump to handle scroll smoothly
                        closeMenu();
                        const targetEl = document.getElementById(targetId.slice(1));
                        if (targetEl) {
                            // Small delay ensures the menu closes before scrolling
                            setTimeout(() => {
                                targetEl.scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth' });
                            }, 150);
                        }
                    }
                });
            });
        }

        function closeMenu() {
            isMenuOpen = false;
            els.menuDropdown.classList.add('opacity-0', 'invisible', 'translate-y-2', 'scale-95');
            els.menuDropdown.setAttribute('aria-hidden', 'true');
            els.menuBtn.setAttribute('aria-expanded', 'false');
        }

        if (els.scrollBtn) {
            els.scrollBtn.addEventListener('click', () => {
                const portfolio = document.getElementById('portfolio');
                if (portfolio) {
                    portfolio.scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth' });
                }
            });
        }

        if (els.backToTop) {
            const portfolioSection = document.getElementById('portfolio');

            window.addEventListener('scroll', () => {
                if (portfolioSection) {
                    const portfolioTop = portfolioSection.offsetTop;
                    if (window.scrollY > portfolioTop - 200) {
                        els.backToTop.classList.add('visible');
                    } else {
                        els.backToTop.classList.remove('visible');
                    }
                }
            }, { passive: true });

            els.backToTop.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: prefersReducedMotion ? 'auto' : 'smooth' });
            });
        }

        if (els.modalClose && els.modalBackdrop) {
            els.modalClose.addEventListener('click', closeProject);
            els.modalBackdrop.addEventListener('click', closeProject);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !els.modal.classList.contains('invisible')) closeProject();
        });

        const contentReady = new Promise(resolve => {
            if (document.readyState === 'complete') resolve();
            else window.addEventListener('load', resolve);
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderFilters();
            renderProjects();

            document.querySelectorAll('.reveal-item').forEach(item => {
                intersectionObserver.observe(item);
            });

            if (els.portfolioSection) {
                sectionObserver.observe(els.portfolioSection);
            }

            const minDisplay = 300;
            const readyTime = Date.now();

            contentReady.then(() => {
                const remaining = Math.max(0, minDisplay - (Date.now() - readyTime));
                setTimeout(() => {
                    els.loading.classList.add('opacity-0');
                    setTimeout(() => els.loading.classList.add('hidden'), 500);
                }, remaining);
            });
        });

        const heroVideo = document.querySelector('.hero-video-container video');
        if (heroVideo) heroVideo.addEventListener('error', () => {
            const fallback = document.querySelector('.hero-fallback');
            if (fallback) fallback.style.display = 'block';
        });

        window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', (e) => {
            if (e.matches) stopSlideshow();
            else if (currentProject) startSlideshow();
        });
    </script>
</body>
</html>
