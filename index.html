<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="Q3JLZWQ — Creative Developer building interactive web experiences and digital products.">

    <!-- Open Graph / Social Preview -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Q3JLZWQ — Creative Developer">
    <meta property="og:description" content="Interactive digital experiences and creative engineering projects.">
    <meta property="og:image" content="/assets/og-preview.jpg">

    <!-- Note: Configure X-Frame-Options: DENY and frame-ancestors 'none' in HTTP server headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; img-src 'self' data: https://raw.githubusercontent.com; font-src 'self' https://fonts.gstatic.com; media-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; connect-src 'self'; upgrade-insecure-requests;">

    <title>Q3JLZWQ — Creative Developer</title>

    <link rel="icon" type="image/png" href="/assets/logo-fav.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">

    <link rel="preload" as="image" href="/assets/bg-poster.webp" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap">
    <link rel="stylesheet" href="style.css">

    <noscript>
        <style>#loadingOverlay { display: none !important; }</style>
    </noscript>
</head>
<body>
    <a href="#portfolio" class="skip-link">Skip to projects</a>

    <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <span class="sr-only">Loading portfolio...</span>
    </div>

    <header class="site-header">
        <nav class="main-nav" aria-label="Main navigation">
            <a href="#heroSection" class="brand-link apple-glass">Q3JLZWQ</a>

            <button id="menuBtn" type="button" class="menu-btn apple-glass" aria-label="Toggle menu" aria-expanded="false" aria-controls="menuDropdown">
                <svg class="menu-icon hamburger-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
                <svg class="menu-icon close-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>

            <ul id="menuDropdown" class="menu-dropdown apple-glass-strong" hidden>
                <li>
                    <a href="#portfolio" class="menu-link">
                        <svg class="menu-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                        </svg>
                        Projects
                    </a>
                </li>
                <li>
                    <a href="mailto:contact@q3jlzwq.com" class="menu-link">
                        <svg class="menu-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                        Contact
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main id="mainContent">
        <section class="hero-section" aria-labelledby="heroTitle" id="heroSection">
            <div class="hero-fallback" aria-hidden="true"></div>
            <div class="hero-video-wrapper" aria-hidden="true">
                <video class="hero-video-container" autoplay loop muted playsinline preload="metadata" poster="/assets/bg-poster.webp">
                    <source src="BG.webm" type="video/webm">
                    <source src="BG.mp4" type="video/mp4">
                </video>
                <div class="hero-overlay"></div>
            </div>

            <div class="container hero-content">
                <h1 id="heroTitle" class="hero-title">Q3JLZWQ</h1>
                <p class="hero-subtitle">Creative developer crafting interactive web experiences &amp; real-time visuals.</p>
            </div>

            <div class="scroll-btn-container">
                <button id="scrollBtn" type="button" class="scroll-btn apple-glass" aria-label="Scroll down to projects">
                    <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 12l-7 7-7-7"></path>
                    </svg>
                </button>
                <span class="scroll-label" aria-hidden="true">Scroll</span>
            </div>
        </section>

        <section id="portfolio" class="section-padding portfolio-section" aria-labelledby="portfolioHeading">
            <div class="container section-header reveal-item">
                <h2 id="portfolioHeading" class="section-title">Selected Projects</h2>
            </div>
            <div id="filterContainer" class="filters-wrapper reveal-item" role="toolbar" aria-label="Filter projects by category"></div>
            <div id="projectsGrid" class="container projects-grid"></div>
        </section>
    </main>

    <footer class="site-footer container">
        <p>&copy; 2026 Q3JLZWQ. <a href="mailto:contact@q3jlzwq.com">contact@q3jlzwq.com</a></p>
    </footer>

    <button id="backToTop" type="button" class="back-to-top apple-glass" aria-label="Back to top" hidden>
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"></path>
        </svg>
    </button>

    <dialog id="projectModal" class="modal-dialog" aria-labelledby="modalTitle">
        <div id="modalContent" class="modal-card apple-glass-strong">
            <button id="modalClose" type="button" class="modal-close-btn" aria-label="Close project details">
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>

            <div class="modal-header">
                <h2 id="modalTitle" class="modal-title"></h2>
                <div id="modalActions" class="modal-actions"></div>
            </div>

            <div id="modalSlideshow" class="slider-wrapper group">
                <button type="button" id="sliderArrowPrev" class="slider-arrow slider-arrow--prev" aria-label="Previous slide">
                    <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <button type="button" id="sliderArrowNext" class="slider-arrow slider-arrow--next" aria-label="Next slide">
                    <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
                <div id="modalSlides"></div>
            </div>
            <div id="modalDots" class="dots-container"></div>

            <p id="modalDesc" class="modal-desc"></p>
            <div id="modalMeta" class="meta-grid"></div>
            <div id="modalTags" class="tags-container"></div>
        </div>
    </dialog>

    <script type="module" src="script.js"></script>
</body>
</html>
